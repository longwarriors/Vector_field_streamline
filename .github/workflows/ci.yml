name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality / Ubuntu / Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python 3.13
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.9"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: py-3.13

      - name: Sync the locked environment
        run: uv sync --locked

      - name: Lint Python sources
        run: uv run --locked ruff check .

      - name: Install headless Chromium for frontend semantics
        run: uv run --locked playwright install --with-deps --only-shell chromium

      - name: Run tests and enforce coverage
        run: uv run --locked pytest

      - name: Build documentation strictly
        run: uv run --locked mkdocs build --strict

      - name: Build clean distributions
        run: uv build --clear

      # Development commits can share one package version; bypass cached local
      # archives so each smoke test installs the distribution built in this run.
      - name: Smoke-check the wheel outside the project
        run: >-
          uv run --isolated --no-project --no-cache
          --with dist/*.whl python -I tests/package_smoke.py

      - name: Smoke-check the source distribution outside the project
        run: >-
          uv run --isolated --no-project --no-cache
          --with dist/*.tar.gz python -I tests/package_smoke.py

  compatibility:
    name: Compatibility / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.9"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: py-${{ matrix.python-version }}

      - name: Sync the locked environment
        run: uv sync --locked

      - name: Run compatibility tests without the canonical coverage gate
        run: uv run --locked pytest --no-cov -m "not browser"

  pages-build:
    name: Build GitHub Pages artifact
    if: github.ref == 'refs/heads/master'
    needs: [quality, compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python 3.13
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.9"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: py-3.13

      - name: Sync the locked environment
        run: uv sync --locked

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build documentation strictly
        run: uv run --locked mkdocs build --strict

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  pages-deploy:
    name: Deploy GitHub Pages
    needs: pages-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
